// Rates（网络设置）
rate "786432"        //  最大允许带宽（高带宽网络推荐值）
cl_interp "0.031"    //  客户端插值时间31毫秒（低延迟＜30ms时优化手感）
cl_interp_ratio "1"  //  插帧值系数（插值1帧，使画面延迟最低）

// Mouse（鼠标设置）
sensitivity "1"                                 //  游戏内鼠标灵敏度倍率1
zoom_sensitivity_ratio "1"              //  狙击枪开镜敏度倍率1
sensitivity_y_scale "1"                    //  垂直灵敏度倍率1（★高敏手腕流、手指流可以稍微提高0.X，利于压枪）
cl_crosshair_recoil "0"                    //  关闭后坐力跟随准星（0=关闭；1=开启）
cl_sniper_auto_rezoom "1"            //  狙击枪开枪后自动开镜（0=关闭；1=开启）
cl_crosshair_friendly_warning "0"  //  关闭瞄准友方警告（0=关闭；1=闪烁提示，2=特殊图标提示）

// Video（画面设置）
fps_max "300"                        //  限制游戏最大帧率300帧（根据电脑性能和显示屏刷新率锁帧）
r_drawtracers_firstperson "1"  //  显示弹道（0=关闭；1=打开）
r_fullscreen_gamma "2.2"       //  游戏画面亮度2.2，即93%，越低越亮（每0.03=1%）

// Audio（音频设置）
snd_headphone_eq "1"                          //  耳机均衡器预设（0=自然；1=清脆；2=平滑）
snd_spatialize_lerp "0"                           //  声音空间化效果混合比例（0=立体声；1=左右声道完全独立）
snd_mute_losefocus  "1"                        //  游戏失去焦点时静音（0=后台继续播放声音；1=静音）
snd_mixahead "0.05"                             //  音频缓冲延迟（50ms音频缓冲，保证音频的兼容性和稳定性）
snd_headphone_pan_exponent "2"        //  耳机声像指数（影响立体声宽度，推荐值1.2或2）
snd_headphone_pan_radial_weight "2"  //  径向声像权重（耳机环绕感，推荐值0.5或2）
cl_mute_all_but_friends_and_party "0"    //  不屏蔽非好友/队伍语音（0=接收所有队友语音；1=仅接收好友和组队语音）

sound_device_override "#OS_Default_Device"  //  系统默认音频输出设备（耳机）【只用一个耳机玩的就默认，有更改音频设备需要的求查看"使用说明"内有详解】
voice_device_override "#OS_Default_Device"   //  系统默认音频输入设备（麦克风）

// Music（音乐盒）【调节范围0-1】★计算公式: 目标百分数→化小数→平方取整，如: 目标音量30%→化小数0.3→再平方0.09
volume "0.81"                                         //  主音量90%
snd_menumusic_volume "0.09"               //  大厅音量30%
snd_roundstart_volume "0"                     //  回合开始音乐静音
snd_roundend_volume "0"                      //  回合结束音乐静音
snd_roundaction_volume "0"                  //  回合行动音乐静音
snd_mvp_volume "0.024"                        //  MVP音乐音量15%
snd_mapobjective_volume "0"                //  地图目标提示音量静音
snd_tensecondwarning_volume "0.024"  //  10秒警告音音量15%
snd_deathcamera_volume "0"                //  死亡回放视角声音静音
snd_mapobjective_volume "0"                //  炸弹/人质音量静音
snd_mute_mvp_music_live_players "1"    //  双方都有存活时禁用MVP音乐（0=开启；1=禁用）

// HUD（UI设置）
hud_scaling "1"                                                          //  HUD缩放比例1（默认值）
cl_hud_color "11"                                                       //  HUD颜色预设（11号配色：粉色）【1白2亮白3浅蓝4蓝5紫6红7橙8黄9绿10浅绿11粉】
hud_showtargetid "1"                                                //  显示瞄准的目标ID/名字（0=禁用；1=启用）
cl_draw_only_deathnotices "0"                                   //  不隐藏UI（仅显示死亡通知；0=隐藏；1=显示）
cl_showloadout "0"                                                    //  装备栏自动隐藏（0=自动隐藏；1=常显）
cl_showpos "0"                                                          //  不显示位置/速度信息（0=自动隐藏；1=常显）
cl_showfps "0"                                                           //  不显示内置FPS计数器（0=禁用；1=简单数字显示；2、3=详细显示）
cl_teamcounter_playercount_instead_of_avatars "1"   //  游戏时队伍计数器显示剩余人数而非玩家头像（0=玩家头像；1=存活人数）
cl_hud_telemetry_serverrecvmargin_graph_show "0"  //  关闭服务器接收余量图表显示（0=关闭；1=性能不佳时显示；2=常显）
cl_hud_telemetry_frametime_show "2"                       //  在右上角显示游戏帧时间和帧数（0=关闭；1=性能不佳时显示；2=常显）
cl_hud_telemetry_ping_show "2"                                //  在右上角显示网络延迟（0=关闭；1=网络不佳时显示；2=常显）

// Radar（雷达）
cl_radar_scale "0.4"                             //  雷达缩放比例0.4（广角雷达）【调节范围0.25-1】
cl_hud_radar_scale "1"                        //  雷达大小1【调节范围0.8-1.3】
cl_radar_icon_scale_min "0.4"              //  雷达中玩家图标尺寸【调节范围0.4-1.25】
cl_radar_always_centered "0"              //  雷达不以玩家为中心（0=不以玩家为中心；1=以玩家为中心）
cl_radar_rotate "1"                              //  雷达随视角旋转（0=固定；1=旋转）
cl_radar_square_with_scoreboard "0"  //  打开计分板时雷达是否变为正方形（0=否；1=是）

// Viewmodel（持枪视角）
viewmodel_presetpos "3"  //  手臂预设位置3（经典右侧）
viewmodel_fov "68"          //  武器模型视野角度68，数越大、枪越小、视野越广【调节范围54-68】
viewmodel_offset_x "2.5"  //  水平偏移2.5【调节范围-2-3.5】
viewmodel_offset_y "1"    //  前后偏移1【调节范围-2-2】
viewmodel_offset_z "-2"   //  垂直偏移-2【调节范围-2-2】

// Crosshair（准星设置）
cl_crosshair_drawoutline "0"
cl_crosshair_dynamic_maxdist_splitratio "1"
cl_crosshair_dynamic_splitalpha_innermod "0"
cl_crosshair_dynamic_splitalpha_outermod "1"
cl_crosshair_dynamic_splitdist "3"
cl_crosshair_outlinethickness "1"
cl_crosshair_sniper_width "1"
cl_crosshair_t "0"
cl_crosshairalpha "200"
cl_crosshaircolor "4"
cl_crosshairdot "0"
cl_crosshairgap "-4"
cl_crosshairgap_useweaponvalue "0"
cl_crosshairsize "1"
cl_crosshairstyle "4"
cl_crosshairthickness "1"
cl_crosshairusealpha "1"
cl_fixedcrosshairgap "3"

cl_grenadecrosshair_keepusercrosshair "0"  //  保持常规准星（0=关闭；1=开启，下同）
cl_grenadecrosshair_smoke "1"                   //  烟雾弹准星开启
cl_grenadecrosshairdelay_smoke "1.5"        //  烟雾弹准星延迟时间（单位：秒，下同）
cl_grenadecrosshair_decoy "0"                    //  诱饵弹准星关闭
cl_grenadecrosshairdelay_decoy "0"            //  诱饵弹准星延迟时间
cl_grenadecrosshair_fire "1"                        //  燃烧弹准星关闭
cl_grenadecrosshairdelay_fire "1.5"             //  燃烧弹准星延迟时间
cl_grenadecrosshair_flash "0"                     //  闪光弹准星关闭
cl_grenadecrosshairdelay_flash "0"             //  闪光弹准星延迟时间
cl_grenadecrosshair_explosive "0"              //  手雷准星关闭
cl_grenadecrosshairdelay_explosive "0"      //  手雷准星延迟时间

// Misc（杂项设置）
developer "0"                                                              //  关闭开发者模式（避免控制台垃圾信息）
con_enable "1"                                                            //  启用控制台
ui_steam_overlay_notification_position "bottomright"  //  Steam好友上线、消息通知位置（右下）【其他位置：topleft 左上、topright 右上、bottomleft 左下】
player_nevershow_communityservermessage "1"         //  不显示社区服务器消息提醒（0=显示；1=隐藏）
mm_dedicated_search_maxping "80"                           //  官方服务器匹配最大搜索延迟80ms（适用国际服）
mm_dedicated_force_servers ""                                   //  根据延迟自动选择最佳官方服务器（无=自动择优）
gameinstructor_enable "0"                                          //  禁用新手向游戏提示（0=禁用；1=开启）
option_duck_method "0"                                            //  按住蹲下（0=按住；1=切换）
option_speed_method "0"                                          //  按住静步（0=按住；1=切换）
cl_autohelp "0"                                                           //  禁用自动帮助提示（0=禁用；1=开启）
cl_teammate_colors_show "1"                                     //  队友头顶显示不同颜色标记（0=关闭；1=打开）
cl_use_opens_buy_menu "0"                                       //  不通过E打开购买菜单（0=禁用；1=允许）
cl_silencer_mode "0"                                                  //  禁用导管（0=禁用；1=允许）
cl_predict_body_shot_fx "0"                                        //  预测击中身体效果（默认值不要动）
cl_predict_head_shot_fx "0"                                        //  预测爆头效果（默认值不要动）
cl_predict_kill_ragdolls "0"                                          //  预测击杀布娃娃效果（默认值不要动）

// Binds（绑定设置）*按照字母表从前到后、数字从小到大顺序排序
unbind "F1"                                                                                                                          //  不绑定F1（绑定后影响投票，不建议绑定）
unbind "F2"                                                                                                                          //  不绑定F2（绑定后影响投票，不建议绑定）
bind "F3" "buy vesthelm;buy ak47;buy m4a1"                                                                       //  F3：一键购买【全甲；AK/M4A1】（若自定义过购买界面武器装备的位置，可能会导致购买错误，详见"使用说明"）
unbind "F4"                                                                                                                          //  不绑定F4（防误触Alt+F4闪退）
bind "F5" "buy smokegrenade;buy molotov;buy incgrenade;buy hegrenade;buy flashbang"  //  F5：一键购买【烟；火（匪火+警火）；雷；闪】（molotov=匪火，incgrenade=警火，下同）
bind "F6" "buy smokegrenade;buy molotov;buy incgrenade;buy flashbang;buy flashbang"   //  F6：一键购买【烟；火；闪；闪】

bind "1" "slot1;spec_player 1"                                  //  数字键1：拿出主武器；观战1号玩家（看demo时，下同）
bind "2" "slot2;spec_player 2"                                  //  数字键2：拿出副武器；观战2号玩家
bind "3" "slot3;spec_player 3"                                  //  数字键3：拿出近战武器武器；观战3号玩家
bind "4" "buy hegrenade;slot6;slot9;spec_player 4"  //  数字键4：购买手雷；拿出手雷；拿出诱饵弹；观战4号玩家
bind "5" "slot5;spec_player 5"                                  //  数字键5：拿出C4；观战1号玩家
bind "6" "spec_player 6"                                          //  数字键6：观战6号玩家
bind "7" "spec_player 7"                                          //  数字键7：观战7号玩家
bind "8" "spec_player 8"                                          //  数字键8：观战8号玩家
bind "9" "spec_player 9"                                          //  数字键9：观战9号玩家
bind "0" "spec_player 10"                                        //  数字键0：观战10号玩家
// slot1-9：1长枪、2手枪、3刀、4投掷物轮盘、5C4、6手雷、7闪、8烟、9火

bind "a" "+left"                                                  //  A：左移
bind "b" "buymenu"                                           //  B：打开购买菜单
bind "c" "buy smokegrenade;slot8"                    //  C：购买烟雾弹；拿出烟雾弹
bind "d" "+right"                                               //  D：右移
bind "e" "+use"                                                 //  E：使用（拆包/下包）
bind "f" "+lookatweapon"                                 //  F：检视武器
bind "g" "drop"                                                 //  G：丢掉武器
bind "h" "say_team .drop;give weapon knife"    //  H：在友方聊天频道中说".drop"（平台一键发刀）；获得一把刀（启用开发者模式时）
bind "m" "teammenu"                                      //  M：选择阵营
bind "n" "buy incgrenade;buy molotov;slot10"  //  N：购买燃烧弹；拿出燃烧弹
bind "p" "say_team .pause"                               //  P：在友方聊天频道中说".pause"（平台一键暂停）
bind "q" "lastinv"                                              //  Q：切枪
bind "r" "+reload"                                             //  R：换弹
bind "s" "+back"                                               //  S：后退
unbind "t"                                                     //  T：不再绑定语音
bind "u" "messagemode2"                                //  U：友方聊天频道
bind "v" "buy flashbang;slot7"                           //  V：购买闪光弹；拿出闪光弹
bind "w" "+forward"                                         //  W：前进
bind "x" "radio2"                                               //  X：快捷讯息2
bind "y" "messagemode"                                  //  Y：公共聊天频道
bind "z" "radio1"                                              //  Z：快捷讯息1

bind "`" "toggleconsole"             //  `：打开控制台
bind "TAB" "+showscores"         //  TAB：打开计分板
bind "Alt" "+spray_menu"          //  Alt：喷漆菜单
bind "Ctrl" "+duck"                    //  Ctrl：下蹲
bind "Shift" "+sprint"                 //  Shift：静步
bind "Escape" "cancelselect"      //  ESC：打开/关闭菜单
bind "SPACE" "+duck"              //  SPACE：下蹲

alias "refundall" "sellback 0;sellback 1;sellback 2;sellback 3;sellback 4;sellback 5;sellback 6;sellback 8;sellback 9;sellback 10;sellback 11;sellback 12;sellback 13;sellback 14;sellback 15;sellback 16;sellback 17;sellback 18;sellback 26;sellback 26;sellback 27;sellback 28;sellback 29;sellback 30;sellback 32;sellback 33;sellback 34;sellback 35;play ui/panorama/itemtile_click_02.vsnd_c"
bind "BACKSPACE" "refundall"  //  Backspace：一键退款所有购买且还未使用的物品

bind "MWHEELUP" "+jump"                                                                                  //  鼠标上滚轮：滚轮跳
bind "MWHEELDOWN" "+jump"                                                                                //  鼠标下滚轮：滚轮跳
bind "MOUSE1" "+attack"                                                                                          //  鼠标左键：开火
bind "MOUSE2" "+attack2"                                                                                        //  鼠标右键：辅助攻击模式
bind "MOUSE3" "player_ping"                                                                                    //  鼠标中键：标记信号
bind "MOUSE4" "+voicerecord"                                                                                 //  鼠标下侧键：语音
bind "MOUSE5" "toggle cl_radar_scale 0.4 0.92;toggle cl_radar_always_centered 1 0"  //  鼠标上侧键：一键缩放雷达（0.4广角时雷达以玩家为中心，0.92小视野时雷达不以玩家为中心）

// Views
key_listboundkeys  //  在控制台中查看目前已绑定的所有按键
